name: tmp-rename-v186
on:
  push:
    paths:
      - .github/workflows/tmp-rename-v186.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rename and verify
        run: |
          set -euo pipefail
          test -f spider-v18.6.jar
          git mv spider-v18.6.jar a-v18.6.png
          test "$(md5sum a-v18.6.png | awk '{print $1}')" = "0399634744eec607e56e0a593ec05bef"
          git config user.name "karldaens"
          git config user.email "karldaens@outlook.com"
          git commit -m "rename spider-v18.6.jar to a-v18.6.png (md5 03996347)"
          git push
