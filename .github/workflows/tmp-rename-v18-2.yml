name: Rename spider-v18.2 to a-v18.2.png

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rename file and verify md5
        run: |
          git mv spider-v18.2.jar a-v18.2.png
          echo "a2be9b7143a3d8c092f229aae27ff846  a-v18.2.png" | md5sum -c -
          git config user.name "karldaens"
          git config user.email "karldaens@users.noreply.github.com"
          git commit -m "Rename spider-v18.2.jar to a-v18.2.png"
          git push
