name: tmp-rename-v185
on:
  push:
    paths:
      - .github/workflows/tmp-rename-v185.yml
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rename and verify
        run: |
          set -euo pipefail
          test -f spider-v18.5.jar
          git mv spider-v18.5.jar a-v18.5.png
          test "$(md5sum a-v18.5.png | awk '{print $1}')" = "e5bed432e004d21da72dd0921844ec51"
          git config user.name "karldaens"
          git config user.email "karldaens@outlook.com"
          git commit -m "rename spider-v18.5.jar to a-v18.5.png (md5 e5bed432)"
          git push
